<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — A clean, interactive To-Do List web application with local storage persistence, task filtering, and responsive design.">
  <title>TaskFlow — Interactive To-Do List</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-badge" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1 class="app-title">TaskFlow</h1>
          <p class="app-description">Organize, track, and accomplish your daily tasks with persistent local storage.</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <div class="card app-card">
        <!-- Add Task Form Section -->
        <section class="task-input-section" aria-label="Add new task">
          <form id="task-form" class="task-form" novalidate>
            <div class="input-wrapper">
              <label for="task-input" class="visually-hidden">Task description</label>
              <input
                type="text"
                id="task-input"
                class="task-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                maxlength="250"
                aria-describedby="task-validation-error"
                required
              >
              <button type="submit" id="add-task-btn" class="btn btn-primary" aria-label="Add task to list">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Task</span>
              </button>
            </div>
            <div id="task-validation-error" class="validation-message" role="alert" aria-live="polite"></div>
          </form>
        </section>

        <!-- Filter Controls -->
        <nav class="filters-bar" aria-label="Task status filters">
          <div class="filter-tabs" role="tablist" aria-label="Filter tasks by status">
            <button
              type="button"
              class="filter-tab active"
              data-filter="all"
              role="tab"
              aria-selected="true"
              id="filter-tab-all"
            >
              All
            </button>
            <button
              type="button"
              class="filter-tab"
              data-filter="active"
              role="tab"
              aria-selected="false"
              id="filter-tab-active"
            >
              Active
            </button>
            <button
              type="button"
              class="filter-tab"
              data-filter="completed"
              role="tab"
              aria-selected="false"
              id="filter-tab-completed"
            >
              Completed
            </button>
          </div>
        </nav>

        <!-- Task List Section -->
        <section class="tasks-section" aria-label="Task items">
          <ul id="task-list" class="task-list" role="list" aria-label="To-do list">
            <!-- Dynamically populated via JavaScript -->
          </ul>

          <!-- Empty State -->
          <div id="empty-state" class="empty-state" role="status" aria-live="polite">
            <div class="empty-icon" aria-hidden="true">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <h2 class="empty-heading" id="empty-heading">No tasks yet</h2>
            <p class="empty-subtext" id="empty-subtext">Add your first task above to start organizing your day.</p>
          </div>
        </section>

        <!-- Footer / Action Bar -->
        <footer class="app-card-footer">
          <span id="task-counter" class="task-counter" role="status" aria-live="polite">No tasks remaining</span>
          <button
            type="button"
            id="clear-completed-btn"
            class="btn btn-secondary clear-completed-btn"
            aria-label="Clear all completed tasks"
            disabled
          >
            Clear completed
          </button>
        </footer>
      </div>
    </main>

    <!-- Page Footer -->
    <footer class="page-footer">
      <p>InternCircle Web Development &bull; Task 03</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
